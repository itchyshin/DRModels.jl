name: Prior hosted convergence diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          ref: 86ee1c2a38cd79c55dbbd71afd7374a3095aad3c
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          ref: 385fde27d369270afb2353ddf1fbd9f301f2b4ce
          path: candidate
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        timeout-minutes: 2
        with:
          version: '1.13.3'
      - name: Record machine
        timeout-minutes: 1
        run: |
          mkdir -p diagnostic-results
          lscpu > diagnostic-results/lscpu.txt
          uname -a > diagnostic-results/uname.txt
          julia --startup-file=no -e 'using InteractiveUtils, LinearAlgebra; versioninfo(verbose=true); println(BLAS.get_config())' > diagnostic-results/julia-runtime.txt
      - name: Instantiate frozen paired environments
        timeout-minutes: 15
        run: julia --startup-file=no diagnostic/tools/ci-prior-hosted-diagnostic/setup.jl "$GITHUB_WORKSPACE"
      - name: Run all four diagnostics and retain failures
        timeout-minutes: 82
        run: python3 diagnostic/tools/ci-prior-hosted-diagnostic/run.py "$GITHUB_WORKSPACE"
      - name: Upload diagnostic evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prior-hosted-paired-diagnostic
          path: diagnostic-results/
