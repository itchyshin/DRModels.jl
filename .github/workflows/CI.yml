name: CI
# Cost-disciplined: PR + manual only, Linux only. Add macOS/Windows + a `push`
# trigger to `main` only right before a tagged release / CRAN-equivalent.
on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly full matrix (Julia 1.10 and 1) on main, so 1.10 stays covered
    # although pull requests run Julia 1 only.
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      run_p10k:
        description: "Include p=10000 in the multi-shape scaling sweep (#16, minutes-scale)"
        required: false
        default: "false"
      release_platforms:
        description: "Run targeted macOS and Windows release checks"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is there anything in this PR that the Julia suite could possibly affect?
  # The suite's checks are REQUIRED on `main` (today by matrix-leg name; after
  # the ci-ok aggregator below, by `ci-ok`), so this must NOT be done with
  # `paths-ignore`: a required check that never reports leaves the PR pending
  # forever. The jobs below therefore always RUN and always report -- they just
  # do no work when only prose changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"   # manual dispatch: always run
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          # Anything OUTSIDE this prose allow-list means run the suite.
          # docs/src and docs/make.jl are deliberately NOT here: Documenter
          # doctests execute code, so a change there still deserves the suite.
          if git diff --name-only "$base" HEAD \
               | grep -qvE '^(docs/dev-log/|docs/design/|LOOP/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Say which way it went
        run: echo "code=${{ steps.filter.outputs.code }}"

      # If we are about to skip the suite, the diff that skips it must at least be
      # clean. Ported from gllvmTMB's "Fast pass for ignored-source/process change",
      # which has had this gate all along -- and which caught a real defect on
      # 2026-09-04 that this repo's version would have waved through: two restored
      # documents carrying 17 lines of trailing whitespace.
      - name: Fast-path validation (a prose-only diff must still be clean)
        if: steps.filter.outputs.code != 'true'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # non-zero on trailing whitespace or a conflict marker in ADDED lines
          git diff --check "$base" HEAD
          {
            echo "### Fast-path validation"
            echo
            echo "Julia suite skipped: prose-only change."
            echo
            echo "Validation run:"
            echo "- \`git diff --check\` over the changed-file range"
            echo "  (trailing whitespace, conflict markers)"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Julia ${{ matrix.version }} - shard ${{ matrix.shard }}/4
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shard the suite 4 ways via DRM_TEST_SHARD (see test/runtests.jl), so
        # 2 versions x 4 shards = 8 jobs each covering ~1/4 of the top-level
        # test files instead of one multi-hour job. Measured 2026-09-03 on this
        # repo's own run history: CI runs took 161 and 175 min, the longest of
        # any repo here. Parallel jobs are free on a public repo.
        # Pull requests run the current stable Julia only; LTS (1.10) runs in
        # the nightly scheduled run on main and on manual dispatch. This halves
        # the runner queue that held PRs for hours (Shinichi, 24 Oct 2026).
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["1"]' || '["1.10", "1"]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/cache@v2
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/julia-buildpkg@v1
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/julia-runtest@v1
        with:
          # Coverage files are collected on the current-stable Julia 1 legs
          # only. Nightly also runs Julia 1.10; uploading both versions of
          # the same src/ lines would double-count on Codecov. PRs already
          # run Julia 1 only. julia-runtest's default is coverage=true.
          coverage: ${{ matrix.version == '1' }}
        env:
          # test/runtests.jl treats an unset/empty value as "run everything", so
          # a local `julia test/runtests.jl` and Pkg.test() are unchanged.
          DRM_TEST_SHARD: ${{ format('{0}/4', matrix.shard) }}
      - if: needs.changes.outputs.code == 'true' && matrix.version == '1'
        uses: julia-actions/julia-processcoverage@v1
      - name: Summarise shard lcov
        if: needs.changes.outputs.code == 'true' && matrix.version == '1'
        run: |
          set -euo pipefail
          test -f lcov.info
          awk '
            /^DA:/ {
              split($0, a, /[:,]/)
              total++
              if (a[3] + 0 > 0) hit++
            }
            END {
              if (total == 0) { print "lcov.info has no DA: lines"; exit 1 }
              printf "shard %s Julia 1: %d/%d lines hit = %.2f%%\n",
                     ENVIRON["SHARD"], hit, total, 100.0 * hit / total
            }
          ' lcov.info
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload shard lcov artefact
        if: needs.changes.outputs.code == 'true' && matrix.version == '1'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov-julia1-shard${{ matrix.shard }}
          path: lcov.info
          if-no-files-found: error
          retention-days: 1
      - if: needs.changes.outputs.code != 'true'
        run: echo "Prose-only change -- Julia suite skipped, this check still reports."

  # ONE stable required check for branch protection. Protection on main used to
  # require the matrix legs by name (`test (1.10)`, `test (1)`); sharding renamed
  # them and #626 sat fully green and BLOCKED forever. Requiring only `ci-ok`
  # makes the rule independent of how the matrix is shaped -- and it composes
  # with the `changes` prose-skip above: a skipped suite still SUCCEEDS its legs
  # (they echo and report), so ci-ok passes on a docs-only PR exactly as the
  # comment on `changes` intends.
  #
  # `if: always()` is load-bearing: without it a failed or cancelled shard makes
  # this job SKIP, and GitHub counts a skipped required check as PASSING.
  # `needs.test.result` is the aggregate over every matrix leg -- "success" only
  # when all eight succeeded; "failure" / "cancelled" / "skipped" otherwise.
  ci-ok:
    name: ci-ok
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard must have succeeded
        run: |
          echo "aggregate result of the test matrix: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"

  # Julia 1.12 focused check. INFORMATIONAL: it is deliberately NOT in the
  # `needs` of `ci-ok`, and the job has `continue-on-error: true`, so a failure
  # here neither blocks a merge nor turns the check-runs red for merge-strict's
  # all-checks-green gate. A failure is NOT to be ignored: whoever sees a red
  # step in this job must report it as a GitHub issue (owner decision P32).
  #
  # Why it exists: Julia 1.12.6 and 1.12.7 compile a loop in
  # `_coerce_response_column` wrongly on some CPUs (AMD Zen 4 and Zen 5), so a
  # `Union{Missing,Int}` response lost rows silently (PR #1326). The sharded
  # matrix above runs Julia 1 (now 1.13) on pull requests and 1.10 nightly,
  # never 1.12. This job runs a short list of files on 1.12 instead of the
  # whole suite: the response-mask test, the missing-data tests, and a small
  # smoke set with one file per main route family.
  #
  # Known gap, kept out on purpose: on Julia 1.12.7 `test_profile_sigma_a.jl`
  # (lines 54 and 56) and `test_postfit_conditional_residuals.jl` (line 367)
  # fail on Totoro's CPU from a separate code generation problem (the first
  # passes with `-C generic`). They are NOT in the list below, and `-C generic`
  # is NOT set here.
  #
  # Run time, measured on Totoro with Julia 1.12.7 (a loaded machine, one
  # process): about 9.6 minutes of tests for the 53 files, 4221 checks, plus
  # a few minutes for package precompilation on a cold cache. The job stops
  # after 30 minutes.
  #
  # Same trigger rules as `test`: pull_request and workflow_dispatch only
  # (no push trigger, and no nightly run: the schedule leg is skipped).
  # Files are run in one process by the same plain `include` loop that the
  # release-platform job uses; the repository has no other runner for a
  # chosen file list (`DRM_TEST_SHARD` selects by position, and
  # `test/shard_by_time.jl` always adds unlisted files).
  # Note: this is `julia -e`, not `Pkg.test()`, so bounds checks are NOT forced
  # on (Pkg.test passes `--check-bounds=yes`, which also hid the row-loss fault).
  julia-1-12:
    name: Julia 1.12 - focused list (informational)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      DRM_CI_FILES: >-
        test_response_mask_j112.jl
        test_missing_response.jl
        test_missing_response_nongaussian.jl
        test_missing_listwise.jl
        test_missing_response_bivariate.jl
        test_bridge_response_mask_inference.jl
        test_1089_missing_rows_dropped.jl
        test_bivariate_missing_default.jl
        test_nobs_rowset_guard.jl
        test_1112_missing_group_label.jl
        test_lss_missing_response.jl
        test_gaussian_core.jl
        test_gaussian_ranef.jl
        test_gaussian_bivariate.jl
        test_locscale_fit.jl
        test_poisson.jl
        test_nbinom2.jl
        test_binomial.jl
        test_gamma.jl
        test_beta.jl
        test_student.jl
        test_lognormal.jl
        test_cumulative.jl
        test_zeroonebeta.jl
        test_tweedie.jl
        test_hurdle.jl
        test_betabinomial.jl
        test_skewnormal.jl
        test_truncated_poisson.jl
        test_zi.jl
        test_poisson_re.jl
        test_gaussian_structured.jl
        test_temporal_ar1.jl
        test_reml.jl
        test_meta.jl
        test_bridge.jl
        test_predict.jl
        test_simulate.jl
        test_profile_ci.jl
        test_bootstrap.jl
        test_inference.jl
        test_postfit.jl
        test_summary.jl
        test_docstring_formula_examples.jl
        test_985_reference_docs_blocks.jl
        test_beta_re.jl
        test_gamma_re.jl
        test_gaussian_spatial.jl
        test_phylo_penalty.jl
        test_cumlogit_ranef.jl
        test_zeroonebeta_mean_ri.jl
        test_variational.jl
        test_nbinom2_re.jl
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Run the focused test list
        shell: bash
        run: |
          julia --project=test -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); using DRModels, Test, LinearAlgebra, SparseArrays, Random; BLAS.set_num_threads(1); println("Julia ", VERSION); cd("test"); files = split(ENV["DRM_CI_FILES"]); failed = String[]; @testset "Julia 1.12 focused list" begin for f in files; t0 = time(); println("RUN ", f); flush(stdout); try include(f) catch err; push!(failed, f); println("FILEFAIL ", f, ": ", sprint(showerror, err)); end; println("TIME ", f, " ", round(time() - t0; digits = 1), " s"); flush(stdout); end; end; isempty(failed) || (println("FAILED FILES: ", join(failed, " ")); exit(1))'

  # Codecov upload is a separate, NON-required job. Do not add `codecov` to
  # branch protection: an OIDC/auth miss must not block `ci-ok`. One upload
  # combines the four Julia-1 Linux shard lcov files so shards are merged
  # rather than treated as duplicate reports. macOS/Windows release-platform
  # jobs and Julia 1.10 nightly legs do not upload.
  codecov:
    name: codecov
    needs: [changes, test]
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Julia 1 shard lcov artefacts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-lcov-julia1-shard*
          path: coverage-shards
          merge-multiple: false
      - name: Combined lcov line counts
        run: |
          set -euo pipefail
          files=(
            coverage-shards/coverage-lcov-julia1-shard1/lcov.info
            coverage-shards/coverage-lcov-julia1-shard2/lcov.info
            coverage-shards/coverage-lcov-julia1-shard3/lcov.info
            coverage-shards/coverage-lcov-julia1-shard4/lcov.info
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "::error::$f missing"; ls -la coverage-shards || true; exit 1; }
          done
          awk '
            /^SF:/ { src = substr($0, 4) }
            /^DA:/ {
              split($0, a, /[:,]/)
              key = src SUBSEP a[2]
              hits[key] += a[3] + 0
              present[key] = 1
            }
            END {
              n = 0; h = 0
              for (k in present) { n++; if (hits[k] > 0) h++ }
              printf "combined unique src lines across 4 shards: %d/%d hit = %.2f%%\n",
                     h, n, (n ? 100.0 * h / n : 0)
            }
          ' "${files[@]}"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: >-
            coverage-shards/coverage-lcov-julia1-shard1/lcov.info,coverage-shards/coverage-lcov-julia1-shard2/lcov.info,coverage-shards/coverage-lcov-julia1-shard3/lcov.info,coverage-shards/coverage-lcov-julia1-shard4/lcov.info
          disable_search: true
          flags: julia-linux-1
          name: julia-linux-1
          use_oidc: true
          fail_ci_if_error: true
          verbose: true

  # Release-only platform coverage. Manual dispatch also retains the existing
  # Linux matrix and scaling-sweep behaviour; this job does not alter ci-ok.
  release-platform:
    name: Release platform - ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.release_platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      JULIA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run targeted release checks
        shell: bash
        run: |
          julia --project=test -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); using DRModels, Test, Random, LinearAlgebra, StatsModels; BLAS.set_num_threads(1); for f in ["test/test_fixed_priors.jl", "test/test_va_followups_1246.jl", "test/test_bootstrap_formula_structured.jl", "test/test_poisson.jl", "test/test_binomial.jl", "test/test_bridge.jl"]; println("RUN ", f); flush(stdout); include(f); end'

  # Engine-quality Q-gate #16: multi-shape (balanced + caterpillar) O(p) scaling
  # sweep. NOT per-PR (the p=10k cell is minutes-scale) — manual dispatch only.
  # Default grid is {100, 1000}; set run_p10k=true to add the p=10k cell.
  scaling-sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run multi-shape scaling gate (#16)
        env:
          DRM_QGATE_PS: ${{ github.event.inputs.run_p10k == 'true' && '100,1000,10000' || '100,1000' }}
          DRM_QGATE_SHAPES: balanced,caterpillar
          DRM_QGATE_NREP: '4'
        run: julia --project=. bench/run_scaling.jl
      - name: Upload scaling report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qgate-multishape-scaling
          path: report/qgate-multishape-scaling.md
