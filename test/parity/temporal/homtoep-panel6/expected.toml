[fit]
family = "gaussian"
formula = "y ~ x + temporal(1 | id, time = occ, structure = \"homtoep\"); sigma ~ 1"
julia_formula = "y ~ x + temporal(1 | id, occ, homtoep)"
data_file = "homtoep_panel6.csv"
group = "id"
structure = "homtoep"
ordinary_intercept = false
method = "ML"
loglik = -2.5552695122837636e+02
n = 240

[coef]
"mu_(Intercept)" = 9.5517517321922263e-02
"mu_x" = 4.026465166156562e-01

[temporal]
sigma = 8.6644845344385246e-01
cor = [5.7112837537346639e-01, 1.0320448501302118e-01, -1.0722583804575331e-02, 3.3727116642771546e-03, 1.3694276272252896e-02]

[status]
converged = true
pdHess = true

[tol]
atol_loglik = 1e-8
rtol_par = 1e-6

[[profile]]
parm = "fixef:mu:x"
lower = 3.2455076598023486e-01
upper = 4.8076485776618055e-01
conf_status = "profile"

