[fit]
family = "gaussian"
formula = "y ~ x + temporal(1 | id, time = occ, structure = \"homtoep\"); sigma ~ 1"
julia_formula = "y ~ x + temporal(1 | id, occ, homtoep)"
data_file = "homtoep_panel6.csv"
group = "id"
structure = "homtoep"
ordinary_intercept = false
method = "ML"
loglik = -2.555269512283781e+02
n = 240

[coef]
"mu_(Intercept)" = 9.5517517321922304e-02
"mu_x" = 4.0264651661565626e-01

[temporal]
sigma = 8.6644845344385246e-01
cor = [5.7112837537346661e-01, 1.0320448501302143e-01, -1.072258380457522e-02, 3.3727116642771685e-03, 1.369427627225283e-02]

[status]
converged = true
pdHess = true

[tol]
atol_loglik = 1e-8
rtol_par = 1e-6

[[profile]]
parm = "fixef:mu:x"
lower = 3.2455076598022958e-01
upper = 4.807648577662369e-01
conf_status = "profile"

