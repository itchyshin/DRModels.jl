[fit]
family = "gaussian"
formula = "y ~ x + temporal(1 | id, time = occ, structure = \"homtoep\"); sigma ~ 1"
julia_formula = "y ~ x + temporal(1 | id, occ, homtoep)"
data_file = "homtoep_neg4.csv"
group = "id"
structure = "homtoep"
ordinary_intercept = false
method = "ML"
loglik = -1.6643769710217606e+02
n = 120

[coef]
"mu_(Intercept)" = -2.815684452636778e-01
"mu_x" = 6.3533887250463006e-01

[temporal]
sigma = 1.1012257617037924e+00
cor = [-5.1049026886498605e-01, 4.399691196153675e-01, -2.9339498771053951e-01]

[status]
converged = true
pdHess = true

[tol]
atol_loglik = 1e-8
rtol_par = 1e-6

[[profile]]
parm = "fixef:mu:x"
lower = 4.7433983566656462e-01
upper = 7.9491202680172235e-01
conf_status = "profile"

